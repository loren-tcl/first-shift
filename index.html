<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="First Shift">
<title>First Shift</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1020; --surface:#1A1C33; --line:#2C2F52; --dim:#3A3D63; --locked:#171830;
  --text:#F3F4FA; --muted:#A7AAC7; --lime:#C8F560; --lime-soft:#E4FAA8; --sky:#7CC8FF; --ink:#0F1020;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button,input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--lime)}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;padding:calc(env(safe-area-inset-top) + 20px) 20px 110px;display:flex;flex-direction:column;gap:16px}
.h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;line-height:1.15;margin:0}
.h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;margin:0}
.sub{font-size:14px;color:var(--muted);margin:0;line-height:1.45}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{height:52px;border-radius:14px;border:none;background:var(--lime);color:var(--ink);font-weight:700;font-size:16px;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--line);color:var(--text)}
.btn.small{height:44px;font-size:14px;width:auto;padding:0 16px}
.chip{padding:8px 14px;border-radius:999px;background:var(--line);border:1px solid transparent;color:var(--text);font-size:14px;cursor:pointer}
.chip.on{background:var(--lime);color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>div{height:8px;border-radius:4px;transition:width .8s ease}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--dim);border-radius:12px;color:var(--text);padding:12px 14px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1.35;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt.most{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:600}
.opt.least{background:var(--locked);color:var(--muted);border-color:var(--dim);text-decoration:line-through}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-radius:999px;white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{height:92px;border-radius:18px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid transparent}
.tile.tried{background:var(--lime);color:var(--ink)}
.tile.explored{background:var(--surface);border-color:var(--lime)}
.tile.locked{background:var(--locked);border:1px dashed var(--dim);color:var(--muted)}
.tile b{font-size:14px}
.quest{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;cursor:pointer;width:100%;text-align:left}
.qicon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--line);color:var(--sky)}
.qicon.main{background:var(--lime);color:var(--ink)}
.xp{font-size:13px;font-weight:700;color:var(--sky);white-space:nowrap}
.xp.main{color:var(--lime)}
.jobcard{background:var(--lime);color:var(--ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.jgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jcell{background:var(--lime-soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.jcell span:first-child{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.jcell span:last-child{font-size:13px;line-height:1.35}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:#000}
.ans{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;line-height:1.5}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(15,16,32,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:480px;margin:0 auto;height:68px;display:flex;justify-content:space-around;align-items:center}
nav.tabs a{color:var(--muted);text-decoration:none;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;min-height:44px;justify-content:center}
nav.tabs a.on{color:var(--lime)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translateX(-50%) translateY(-120px);background:var(--lime);color:var(--ink);font-weight:700;padding:12px 18px;border-radius:999px;z-index:20;transition:transform .35s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.back{background:none;border:none;color:var(--muted);font-size:15px;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:44px;width:fit-content}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>div{height:6px;background:var(--lime);transition:width .3s ease}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.scale button{min-height:56px;padding:6px 4px;line-height:1.2;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px}
.scale button.on{background:var(--lime);color:var(--ink);font-weight:700;border-color:var(--lime)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;line-height:1.35;min-height:84px}
.sample{font-size:11px;font-weight:700;color:var(--ink);background:var(--sky);padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.streakbig{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;line-height:1}
.center{text-align:center}
</style>
</head>
<body>
<div class="app">
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" hidden><div class="in" id="tabsin"></div></nav>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="pros.js"></script>
<script src="dreams.js"></script>
<script src="app.js"></script>
</body>
</html>
